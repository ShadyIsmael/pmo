server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Baseline security headers for the SPA shell and proxied API.
    # Placed at server level so every location inherits them. Do NOT add
    # add_header in a child location without re-declaring these: nginx's
    # add_header directive does NOT inherit from parent contexts, so a
    # child add_header silently drops all server-level headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-store" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self), clipboard-read=(self), clipboard-write=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.gstatic.com/firebasejs/12.19.0/; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://firebaseinstallations.googleapis.com https://fcmregistrations.googleapis.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Keep API failures as API responses. They must never fall through to the SPA shell.
    location ^~ /api/ {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router deep links resolve to the SPA entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
