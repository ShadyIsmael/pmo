name: PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    name: Security static analysis
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.182.0
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Enforce immutable GitHub Action references
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          : "${BASE_SHA:?Pull request base SHA is required}"
          git show "$BASE_SHA:.github/scripts/check-action-pins.py" | python3 -

      - name: Check tenant, endpoint, secret, auth-storage, XSS, Next import patterns, and supply chain
        run: semgrep scan --config .semgrep/pmo-security.yml --config p/supply-chain --config p/secrets --config p/javascript --config p/typescript --config p/csharp --error --metrics=off

  web-react:
    name: Web (React) validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: 'npm'

      - name: Test security validation gates
        run: |
          node --test .agents/skills/security-audit/validate-findings.test.cjs
          python3 .github/scripts/test_enforce_codeql_severity.py

      - name: Enforce React-only frontend policy
        run: node scripts/ci/check-supported-frontend.mjs

      - name: Install root dependencies
        run: npm ci

      - name: Install web-react dependencies
        run: npm --prefix apps/web-react ci

      - name: Audit root npm dependencies
        run: npm audit --audit-level=moderate

      - name: Audit web-react npm dependencies
        run: npm --prefix apps/web-react audit --audit-level=moderate

      - name: Typecheck
        run: npm --prefix apps/web-react run typecheck

      - name: Lint
        run: npm run lint:web

      - name: Test
        run: npm --prefix apps/web-react run test

      - name: i18n parity
        run: npm run i18n:parity

      - name: i18n used keys
        run: npm run i18n:used-keys

  api:
    name: API (.NET) build and security regressions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restore
        run: >-
          dotnet restore apps/api/NEXUS.slnx --verbosity minimal
          -p:NuGetAudit=true -p:NuGetAuditLevel=moderate -p:NuGetAuditMode=all
          -warnaserror:NU1900,NU1902,NU1903,NU1904,NU1905

      - name: Build
        run: dotnet build apps/api/NEXUS.slnx -c Release --no-restore

      - name: Run API security regression suite
        run: >-
          dotnet test apps/api/tests/NEXUS.Api.Tests/NEXUS.Api.Tests.csproj
          --configuration Release --no-build --no-restore
          --filter "FullyQualifiedName~NEXUS.Api.Tests.Security|FullyQualifiedName~AuthenticationPipelineTests|FullyQualifiedName~ProjectPublicIdRoutingMiddlewareTests"

      - name: Run Approvals regression suite
        run: >-
          dotnet test apps/api/tests/NEXUS.Modules.Approvals.Tests/NEXUS.Modules.Approvals.Tests.csproj
          --configuration Release --no-build --no-restore

      - name: Run WorkflowEngine regression suite
        run: >-
          dotnet test apps/api/tests/NEXUS.Modules.WorkflowEngine.Tests/NEXUS.Modules.WorkflowEngine.Tests.csproj
          --configuration Release --no-build --no-restore

      - name: Run WorkItems regression suite
        run: >-
          dotnet test apps/api/tests/NEXUS.Modules.WorkItems.Tests/NEXUS.Modules.WorkItems.Tests.csproj
          --configuration Release --no-build --no-restore

      - name: Run ResourceManagement cost-utilization regressions
        run: >-
          dotnet test apps/api/tests/NEXUS.Modules.ResourceManagement.Tests/NEXUS.Modules.ResourceManagement.Tests.csproj
          --configuration Release --no-build --no-restore
          --filter "FullyQualifiedName~CostUtilizationManagementScopeTests|FullyQualifiedName~CostUtilizationTeamFilterTests"
