version: '3.8'

# Set NEXUS_DB_PASSWORD in the environment or a local .env file before starting Compose.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nexus-sqlserver
    security_opt:
      - no-new-privileges:true
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${NEXUS_DB_PASSWORD:?NEXUS_DB_PASSWORD must be set}
      MSSQL_PID: "Developer"
    ports:
      # Bind to loopback only: the database must never be reachable from an external network.
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    security_opt:
      - no-new-privileges:true
    environment:
      REDIS_PASSWORD: ${NEXUS_REDIS_PASSWORD:-}
    # Authentication is optional for local runs; when NEXUS_REDIS_PASSWORD is set the server
    # requires it. The port below binds to loopback so it is never externally reachable.
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server
        fi
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: nexus-api
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # Defaults to Production so a plain `docker compose up` never enables Swagger,
      # auto-migration, or demo seeding. Set ASPNETCORE_ENVIRONMENT=Development for local dev.
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:5000
      # Compose requires a non-empty secret before starting.
      Jwt__Secret: ${NEXUS_JWT_SECRET:?NEXUS_JWT_SECRET must be set}
      Firebase__ProjectId: nexus-pmo-36fbf
      Firebase__CredentialsJson: ${FIREBASE_CREDENTIALS_JSON-}
      Firebase__AllowApplicationDefaultCredentials: ${FIREBASE_ALLOW_APPLICATION_DEFAULT-false}
      ConnectionStrings__DefaultConnection: Server=sqlserver;Database=NexusPmo;User Id=sa;Password=${NEXUS_DB_PASSWORD:?NEXUS_DB_PASSWORD must be set};Encrypt=True;TrustServerCertificate=False;MultipleActiveResultSets=true
      Redis__ConnectionString: redis:6379
    ports:
      - "5000:5000"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web-react
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL-}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID-}
        VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY-}
    container_name: nexus-web
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    ports:
      - "4000:80"
    depends_on:
      - api
    restart: unless-stopped
  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.worker
    container_name: nexus-worker
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # Compose requires a non-empty secret before starting.
      Jwt__Secret: ${NEXUS_JWT_SECRET:?NEXUS_JWT_SECRET must be set}
      Firebase__ProjectId: nexus-pmo-36fbf
      Firebase__CredentialsJson: ${FIREBASE_CREDENTIALS_JSON-}
      Firebase__AllowApplicationDefaultCredentials: ${FIREBASE_ALLOW_APPLICATION_DEFAULT-false}
      ConnectionStrings__DefaultConnection: Server=sqlserver;Database=NexusPmo;User Id=sa;Password=${NEXUS_DB_PASSWORD:?NEXUS_DB_PASSWORD must be set};Encrypt=True;TrustServerCertificate=False;MultipleActiveResultSets=true
      Redis__ConnectionString: redis:6379
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlserver-data:
  redis-data:

networks:
  default:
    name: nexus-network
