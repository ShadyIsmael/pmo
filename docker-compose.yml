version: '3.8'

# Set NEXUS_DB_PASSWORD in the environment or a local .env file before starting Compose.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nexus-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${NEXUS_DB_PASSWORD:?NEXUS_DB_PASSWORD must be set}
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${NEXUS_DB_PASSWORD:?NEXUS_DB_PASSWORD must be set}" -C -Q "SELECT 1" || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: nexus-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      Firebase__ProjectId: nexus-pmo-36fbf
      Firebase__CredentialsJson: ${FIREBASE_CREDENTIALS_JSON-}
      Firebase__AllowApplicationDefaultCredentials: ${FIREBASE_ALLOW_APPLICATION_DEFAULT-false}
      ConnectionStrings__DefaultConnection: Server=sqlserver;Database=NexusPmo;User Id=sa;Password=${NEXUS_DB_PASSWORD:?NEXUS_DB_PASSWORD must be set};TrustServerCertificate=True;MultipleActiveResultSets=true
      Redis__ConnectionString: redis:6379
    ports:
      - "5000:5000"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL-http://localhost:5000}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID-}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET-}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID-}
        NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${NEXT_PUBLIC_FIREBASE_VAPID_KEY-}
    container_name: nexus-web
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:5000
    ports:
      - "4000:4000"
    depends_on:
      - api
    restart: unless-stopped

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.worker
    container_name: nexus-worker
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Firebase__ProjectId: nexus-pmo-36fbf
      Firebase__CredentialsJson: ${FIREBASE_CREDENTIALS_JSON-}
      Firebase__AllowApplicationDefaultCredentials: ${FIREBASE_ALLOW_APPLICATION_DEFAULT-false}
      ConnectionStrings__DefaultConnection: Server=sqlserver;Database=NexusPmo;User Id=sa;Password=${NEXUS_DB_PASSWORD:?NEXUS_DB_PASSWORD must be set};TrustServerCertificate=True;MultipleActiveResultSets=true
      Redis__ConnectionString: redis:6379
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlserver-data:
  redis-data:

networks:
  default:
    name: nexus-network
